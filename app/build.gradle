plugins {
    id 'com.android.application'
}

android {
    namespace 'io.reddirtcode.cookbook'
    compileSdk 36

    defaultConfig {
        applicationId 'io.reddirtcode.cookbook'
        minSdk 26
        targetSdk 35
        versionCode 205
        versionName '0.2.5-alpha'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug {}
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.18.0'
    implementation 'androidx.core:core:1.16.0'
    implementation 'com.google.mlkit:text-recognition:16.0.1'

    // Align the legacy JDK7/JDK8 Kotlin bridge artifacts with ML Kit's Kotlin stdlib.
    // Older 1.6.21 bridges duplicate classes already included in kotlin-stdlib 1.8.22.
    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22')
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22')
    }
}
